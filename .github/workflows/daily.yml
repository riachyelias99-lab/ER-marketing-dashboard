name: Daily dashboard update

on:
  schedule:
    # 04:23 UTC = 06:23 in Beirut in winter (UTC+2), 07:23 in summer (UTC+3).
    # Deliberately NOT on the hour. GitHub queues every ":00" cron on the
    # platform at the same moment, and runs in that queue are started late or
    # dropped entirely under load — this one was scheduled for 04:00 and never
    # fired at all. An odd minute sits outside the stampede.
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simulate a broken day (pretend GHL sent only half the contacts) — for demos only'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Safety net: a stuck run can never burn hours of CI time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A broken rule must never publish: tests run first.
      - name: Run tests
        run: npm test

      - name: Fetch, validate, clean and calculate
        run: node pipeline/run.mjs
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || 'false' }}

      # always(): even if the run step crashed, commit whatever status it managed to write.
      - name: Publish (commit the new data files)
        if: always()
        run: |
          if [ -z "$(git status --porcelain public/data)" ]; then
            echo "No data changes."
            exit 0
          fi
          RESULT=$(node -p "require('./public/data/status.json').result")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: update $(date -u +%F) (${RESULT})"
          git pull --rebase
          git push

      # After the status is published, make a failed health check show as a red run
      # (GitHub then emails the repo owner).
      - name: Flag a paused update
        if: always()
        run: |
          RESULT=$(node -p "require('./public/data/status.json').result" 2>/dev/null || echo missing)
          if [ "$RESULT" = "fail" ]; then
            echo "::error::Health checks failed — the dashboard is showing the previous day's data."
            exit 1
          fi
